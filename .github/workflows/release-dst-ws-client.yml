name: Release dst-ws-client

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    name: linux-amd64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"

      - name: Build single-file program
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o dist/dst-ws-client-linux-amd64 ./dst-ws-client.go
          chmod +x dist/dst-ws-client-linux-amd64

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/dst-ws-client-linux-amd64
            DST_SCRIPT.sh
            config.example.json
          body: |
            本版本修复测试版服务端下载、切换和存档路径处理。

            ### 测试版服务端

            - SteamCMD 使用公开测试分支 `updatebeta`；只有配置分支密码时才传入 `-betapassword`。
            - 测试版本体与正式版本体使用独立目录，切换前检查版本文件、SteamCMD 清单、测试分支标记和服务端主程序。
            - 测试版使用独立存档根目录；切换时复制已有存档和 Token，正式版原存档保留。
            - 下载失败时保留原游戏版本配置；缺少测试版本体时阻止启动并给出提示。
            - SteamCMD 默认直连内容服务器，可通过 `DST_SCRIPT_STEAMCMD_USE_PROXY=true` 使用系统代理。
            - 补充测试版下载、版本切换、本体检查和存档路径的隔离测试。

            ### 发布内容

            - Release 附带 `dst-ws-client-linux-amd64`、`DST_SCRIPT.sh` 和 `config.example.json`。
            - `DST_SCRIPT.sh` 脚本版本更新至 `1.8.24`。
          fail_on_unmatched_files: true
