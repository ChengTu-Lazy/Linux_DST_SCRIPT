name: Release dst-ws-client

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    name: linux-amd64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"

      - name: Build single-file program
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o dist/dst-ws-client-linux-amd64 ./dst-ws-client.go
          chmod +x dist/dst-ws-client-linux-amd64

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/dst-ws-client-linux-amd64
            DST_SCRIPT.sh
            config.example.json
          body: |
            本版本修复自动游戏更新后的漏重启，并限制后台 SteamCMD 等待时间。

            ### 自动游戏更新

            - 游戏本体更新后保留待重启状态，玩家在线或安全关闭失败时在下次检查重试。
            - 共用同分支游戏本体的存档分别检查启动 buildid，避免只重启下载更新的存档。
            - 自动游戏更新默认设置 600 秒 SteamCMD 超时，可通过 `AUTO_UPDATE_GAME_TIMEOUT_SECONDS` 调整；超时后恢复维护循环。
            - 补充重启重试、共用本体及超时处理的隔离回归测试。

            ### 发布内容

            - Release 附带 `dst-ws-client-linux-amd64`、`DST_SCRIPT.sh` 和 `config.example.json`。
            - `DST_SCRIPT.sh` 脚本版本更新至 `1.8.25`。
          fail_on_unmatched_files: true
