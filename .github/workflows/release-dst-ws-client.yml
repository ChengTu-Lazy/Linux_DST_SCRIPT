name: Release dst-ws-client

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    name: linux-amd64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"

      - name: Build single-file program
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o dist/dst-ws-client-linux-amd64 ./dst-ws-client.go
          chmod +x dist/dst-ws-client-linux-amd64

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/dst-ws-client-linux-amd64
            DST_SCRIPT.sh
            config.example.json
          body: |
            本版本为游戏本体更新增加通用的安装清单恢复，处理旧清单请求被 Steam 拒绝导致的更新失败。

            ### 自动游戏更新

            - 本体安装与更新刷新 Steam 应用信息，正式版显式选择 `public`，测试版保留配置的分支和密码。
            - 仅在本次日志明确显示已安装 depot/manifest 请求被 `Access Denied` 拒绝时，备份安装清单并重建安装状态一次，复用现有游戏文件；不固定 depot、清单号、版本号或存档名称。
            - 恢复失败还原原安装清单，诊断备份保留在 `steamapps/dst-script-manifest-recovery.XXXXXX/`；普通网络错误和历史错误不会触发恢复。
            - 脚本内本体更新使用非阻塞锁，正常更新与恢复共用超时预算；外部手动 SteamCMD 不受此锁管理。
            - 更新失败保留未完成标记，后续检查优先修复安装，成功后再根据存档启动版本处理重启。

            ### 验证

            - 隔离回归测试：169 项通过，覆盖恢复、回滚、分支参数、锁、超时预算与未完成更新处理。
            - 真实 SteamCMD：复现旧清单拒绝后，自动恢复返回退出码 0 和固定安装成功标志。
            - 真实服务器：后续完整检查成功启动游戏版本 `756039`、buildid `25643504`，再次检查无额外重启。首次安全关闭检查失败后由后续检查恢复，本版本未调整安全关闭判定。

            ### 发布内容

            - Release 附带 `dst-ws-client-linux-amd64`、`DST_SCRIPT.sh` 和 `config.example.json`。
            - `DST_SCRIPT.sh` 脚本版本更新至 `1.8.26`。
          fail_on_unmatched_files: true
