name: Release dst-ws-client

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    name: linux-amd64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"

      - name: Build single-file program
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o dist/dst-ws-client-linux-amd64 ./dst-ws-client.go
          chmod +x dist/dst-ws-client-linux-amd64

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/dst-ws-client-linux-amd64
            DST_SCRIPT.sh
            config.example.json
          body: |
            本版本重点强化 DST 服务端启动诊断、Mod 修复、自动维护备份及游戏版本更新判定。

            ### 启动与 Mod 修复

            - 启动检查改为基于本次新增日志判断 ready、fatal 与终止状态，避免历史日志导致误判。
            - 对能够明确归属的 Workshop Mod 故障执行事务式修复；替换失败时恢复旧文件，归属不明确时保留现场。
            - 为 SteamCMD Mod 下载增加最大尝试次数和总时长边界，并将失败状态传播给启动流程。
            - 精确识别 DST 进程与 `screen` 会话，避免重复启动或误关闭名称相近的会话。
            - 关闭分片时校验本次保存和关闭日志，失败时停止后续重启并保留现场。

            ### 自动维护与备份

            - 自动备份前检查在线玩家；有人在线时跳过本轮备份。
            - 备份压缩使用低 CPU、低 I/O 优先级和临时文件，成功后再原子替换正式 ZIP。
            - Mod 与游戏本体使用独立计时器，默认分别约每 1 分钟和 10 分钟检查一次。
            - 保留 `auto_update_anyway = true` 的原有默认行为，不改变服务器强制更新策略。

            ### 游戏与脚本更新

            - 根据存档分支从 Klei 官方 `builds.json` 获取正式版或测试版最新服务端版本号。
            - 本地版本与官方一致时不再执行完整 SteamCMD 校验；远端版本更高时才进入更新流程。
            - `version.txt` 缺失时执行一次 SteamCMD 修复安装，官方版本低于本地时停止并保留现场。
            - SteamCMD 更新继续同时校验退出码和 `Success! App '343050' fully installed.` 固定成功标志。
            - 更新完成后比较 `version.txt` 与 buildid，仅确认发生变化时重启服务器。
            - 脚本自更新会先校验候选脚本语法，再通过临时文件原子替换当前脚本。

            ### 验证

            - 新增隔离测试脚本，覆盖启动、Mod 修复、关闭、备份、游戏版本检查和脚本自更新流程。
            - 当前测试结果为 `passed=82 failed=0`。

            ### 发布内容

            - Release 附带 `dst-ws-client-linux-amd64`、`DST_SCRIPT.sh` 和 `config.example.json`。
            - `DST_SCRIPT.sh` 脚本版本更新至 `1.8.21`。
          fail_on_unmatched_files: true
